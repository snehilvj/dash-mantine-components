name: Run tests

on:
  push:
    branches: [master]
    tags:
      - v*
  pull_request:
    branches: [master]

jobs:
  test-react:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v3
        with:
          python-version: 3.12

      - name: Start XVFB
        run: Xvfb :99 &

      - name: Setup uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv

      - name: Install package
        run: |
          source .venv/bin/activate
          uv pip install --upgrade pip
          uv pip install wheel
          uv pip install ".[dev]"
          npm i
          npm run build
        timeout-minutes: 20

      - name: Run tests
        env:
          DISPLAY: :99
          REACT_VERSION: 19.2.4
        run: |
          source .venv/bin/activate
          uv pip install -e .
          pytest --headless